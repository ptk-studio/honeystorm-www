<p>Tell us what worked and what we should change. We read every message.</p>

</main><script>(function(){"use strict";
var f=document.getElementById("fb");if(!f)return;var t0=Date.now();

 var r=f.querySelector("input[name=rating]:checked");
 var liked=f.liked.value.trim(),change=f.change.value.trim();
 if(!r&&!liked&&!change){say("Please pick a rating or write a few words.");return;}
 var parts=[];if(liked)parts.push("What did you like?\n"+liked);if(change)parts.push("What should we change?\n"+change);
 var body={kind:"other",message:parts.join("\n\n")||"(rating only)",page_url:location.origin+location.pathname,
  website:f.website.value,elapsed_ms:Date.now()-t0,platform:"web"};
 if(r)body.rating=Number(r.value);
 var em=f.email.value.trim();if(em&&f.consent.checked){body.email=em;body.consent=true;}
 var b=f.querySelector("button");b.disabled=true;say("Sending…");
 fetch(f.getAttribute("data-api")+"/feedback/v1/"+f.getAttribute("data-key"),{method:"POST",mode:"cors",credentials:"omit",

 .then(function(res){if(res.status===202){f.reset();say("Thank you! We read every message.");}
  else{b.disabled=false;say(res.status===429?"Too many messages just now. Please try again later.":"That didn't send. Please try again.");}})
 .catch(function(){b.disabled=false;say("That didn't send. Please check your connection and try again.");});
});})();</script><script>
(function(){"use strict";

 try{if(navigator.sendBeacon&&navigator.sendBeacon(api,b))return;}catch(e){}
 try{fetch(api,{method:"POST",body:b,keepalive:true,mode:"cors",credentials:"omit"});}catch(e){}}
var page=document.documentElement.getAttribute("data-page")||location.pathname;
// Carry our sanitised campaign tag onto the /go links, so the click here and the go there share a source.
if(src){var gl=document.querySelectorAll("a[data-product]");for(var i=0;i<gl.length;i++){var h=gl[i].getAttribute("href")||"";if(h.indexOf("/go/")===0&&h.indexOf("?")<0)gl[i].setAttribute("href",h+"?src="+src);}}

 if(b){var box=b.closest(".poll");if(!box||box.getAttribute("data-done"))return;box.setAttribute("data-done","1");

 var a=e.target.closest&&e.target.closest("a[data-product]");
 if(!a)return;
 send({kind:"click",product:a.getAttribute("data-product"),page:page});
